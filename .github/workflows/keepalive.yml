# Free Supabase projects pause after 7 days without activity.
# This pings the database twice a week so the app stays awake.
# Add repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (Settings -> Secrets and variables -> Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 * * 1,4" # Mon & Thu 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
